# Cursor automations (cloud agents that fire on a trigger).
#
# With CURSOR_API_KEY set, Fabrica manages automations through Cursor's
# Automations API, the one Cursor's Terraform provider uses. That API can
# create, read, update and delete an automation, but not list them, so
# Fabrica finds what it made by the IDs in state (find_by_remote_id).
# Without the key, it falls back to handoffs.
#
# The triggers and tools are what that API offers as of October 2026: no
# pull request "reopened" event, and no Linear tool (Linear only triggers
# automations), so Linear needs its MCP fallback.
kind: cloud
description: Cursor automations (cloud agents)
apply_modes: [api, handoff]
find_by_identity: false
find_by_remote_id: true
skill_transport: text
mcp_auth:
  header: native
  url: native
triggers:
  schedule: native
  github.pull_request.opened: native
  github.pull_request.synchronize: native
  github.pull_request.labeled: native
  github.push: native
connectors:
  github: native
  slack: native
  linear: emulated
  mcp.http: native
  # Cloud agents don't support SSE servers, and stdio servers would need
  # to be installed inside the agent's sandbox.
  mcp.sse: unsupported
  mcp.stdio: unsupported
side_effects:
  "*": emulated
# Each automation has its own memory tool, which is on by default and can
# be turned off. The stub turns it on for routines that need memory and off
# for the rest, so memory never steers a routine that didn't ask for it.
memory: native
