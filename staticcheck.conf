# staticcheck's defaults, plus one change: ST1005 wants error messages to
# start with a lowercase letter, but ours often start with a name, like
# "Fabrica can't…" or "Cursor has no…", and those are capitalized.
checks = ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
