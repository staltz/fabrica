# Claude Code on your machine.
#
# `fabrica apply` adds a user-level `fabrica` MCP server to ~/.claude.json
# and installs local routines as hooks in ~/.claude/settings.json, or, for a
# schedule trigger, as desktop app scheduled tasks in
# ~/.claude/scheduled-tasks/<id>/SKILL.md. It never writes into a product
# repo. Local runtimes count as api mode, because
# Fabrica edits their config files directly, and Fabrica finds its own
# installs by their names (`fabrica`, `fabrica-…`) and hook commands.
kind: local
description: Claude Code (CLI and IDE extensions) on your machine
apply_modes: [api]
find_by_identity: true
skill_transport: directory
# An init routine's session can run here, on the machine that runs `fabrica
# apply`: Fabrica clones the repo and starts `claude -p` in it, in the
# background, connected to the factory's Fabrica server. It needs Claude
# Code's command line, and never runs in CI.
launch_modes: [api]
# How a launched session reaches the factory's Fabrica server: --mcp-config
# takes request headers.
mcp_auth:
  header: native
triggers:
  session.start: native    # SessionStart hook
  prompt.submit: native    # UserPromptSubmit hook
  session.stop: native     # Stop hook
  git.pre_commit: native   # PreToolUse hook on Bash, for `git commit`
  git.pre_push: native     # PreToolUse hook on Bash, for `git push`
  # A desktop app scheduled task, one per repo. The app keeps the schedule
  # and folder outside SKILL.md and only runs tasks it created, so `fabrica
  # apply` says how to register a new one there. Tasks only run while the
  # app is open and the computer is awake.
  schedule: native
connectors:
  mcp.http: native
  mcp.sse: native
  mcp.stdio: native
  # There's no built-in GitHub integration locally, but a GitHub connector
  # with an MCP fallback works: Fabrica registers the fallback server.
  github: emulated
  slack: emulated
  linear: emulated
side_effects:
  "*": emulated
# Local tools' own memories are per project, not per routine, so a routine
# that needs memory gets it from Fabrica, in runs.db.
memory: emulated
# Hooks run inside the session you already have open, on its model, and
# scheduled tasks on the model the desktop app is set to, so there's no
# models: list, and only a routine's `default` entry matches.
