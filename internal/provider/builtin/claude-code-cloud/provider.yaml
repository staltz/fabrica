# Claude Code routines, running on claude.ai.
#
# Our best reading of the Claude Code docs as of October 2026. Routines can
# fire on a schedule (at most hourly) or on GitHub pull request and release
# events. There's no public API to create or list routines yet (the API can
# only fire one), so Fabrica uses handoff: it writes instructions and you, or
# an AI with computer use, click through the setup.
kind: cloud
description: Claude Code routines on claude.ai
apply_modes: [handoff]
find_by_identity: false
skill_transport: text
mcp_auth:
  # Custom connectors may accept request headers, but it isn't documented
  # whether routines send them, so we put the token in the URL to be safe.
  header: unsupported
  url: native
triggers:
  schedule: native
  github.pull_request.opened: native
  github.pull_request.synchronize: native
  github.pull_request.reopened: native
  github.pull_request.ready_for_review: native
  github.pull_request.closed: native
  github.release.published: native
connectors:
  github: native
  slack: native
  linear: native
  notion: native
  mcp.http: native
  mcp.sse: native
  mcp.stdio: unsupported
side_effects:
  # Claude acts through its connectors' tools, so every side effect turns
  # into prompt instructions plus the connector that carries it out.
  "*": emulated
# Routines have no documented memory setting of their own, so a routine
# that needs memory gets it from Fabrica (memory_save, and the memory that
# routine_get shows).
memory: emulated
# Each routine has an "Auto-fix pull requests" setting: after a run opens a
# pull request, Claude keeps watching its CI and review comments, and pushes
# fixes. The stub turns it on for routines with autofix: true and off for
# the rest, so no routine pushes to its pull requests unasked.
autofix: native
# The models a routine can pick (Opus, Sonnet, Haiku and Fable) and their
# effort levels, as claude.ai shows them as of October 2026.
models:
  claude-fable-5-1: [low, medium, high, xhigh, max]
  claude-opus-5-5: [low, medium, high, xhigh, max]
  claude-sonnet-5-5: [low, medium, high, xhigh, max]
  claude-haiku-5-5: [low, medium, high, xhigh, max]
