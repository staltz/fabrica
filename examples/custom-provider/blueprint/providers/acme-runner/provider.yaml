# The capability matrix of "Acme Runner", a pretend in-house agent runner.
# It's plain data: `fabrica check` and `fabrica plan` read it without
# running any code.
kind: cloud
description: Acme Runner, our in-house agent runner (an example folder provider)

# Try the API first. If the api program were missing, Fabrica would fall
# back to writing handoff instructions from handoff.md.
apply_modes: [api, handoff]

# Our API can list resources and read their Fabrica identity back, which
# api mode needs, so Fabrica never creates duplicates.
find_by_identity: true

# Cloud runtimes read skills file by file over MCP.
skill_transport: text

# Acme Runner can send an Authorization header to MCP servers.
mcp_auth:
  header: native
  url: native

triggers:
  github.issues.opened: native
  schedule: native

connectors:
  github: native
  mcp.http: native

side_effects:
  # Acme Runner can post an issue comment by itself. The stub turns that on
  # for routines that list github.issue_comment, and off for the rest.
  github.issue_comment: native
  "*": emulated

# Acme Runner can't remember anything between jobs, so routines that need
# memory get it from Fabrica.
memory: emulated

# A real runner's api program would need a key to call its API. Declare it
# here, and `fabrica auth login` asks for it (opening url), saves it in your
# keychain, and Fabrica hands it to the api program in its environment.
# Without it, Fabrica falls back to handoffs. This example's api program
# keeps its "runtime" in a file, so it needs none.
#
# credentials:
#   ACME_API_KEY:
#     description: an Acme Runner API key
#     url: https://acme-runner.example.com/settings/api-keys
#     instructions: Click New key, and copy it.
