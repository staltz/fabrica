# Cursor automations (cloud agents that fire on a trigger).
#
# With a Cursor API key (in CURSOR_API_KEY, or saved by `fabrica auth
# login`), Fabrica manages automations through Cursor's Automations API,
# the one Cursor's Terraform provider uses. That API can create, read,
# update and delete an automation, but not list them, so Fabrica finds
# what it made by the IDs in state (find_by_remote_id). Without the key,
# it falls back to handoffs.
#
# The triggers and tools are what that API offers as of October 2026: no
# pull request "reopened" event, and no Linear tool (Linear only triggers
# automations), so Linear needs its MCP fallback.
kind: cloud
description: Cursor automations (cloud agents)
apply_modes: [api, handoff]
find_by_identity: false
find_by_remote_id: true
skill_transport: text
mcp_auth:
  header: native
  url: native
triggers:
  schedule: native
  github.pull_request.opened: native
  github.pull_request.synchronize: native
  github.pull_request.labeled: native
  github.push: native
connectors:
  github: native
  slack: native
  linear: emulated
  mcp.http: native
  # Cloud agents don't support SSE servers, and stdio servers would need
  # to be installed inside the agent's sandbox.
  mcp.sse: unsupported
  mcp.stdio: unsupported
side_effects:
  "*": emulated
# Each automation has its own memory tool, which is on by default and can
# be turned off. The stub turns it on for routines that need memory and off
# for the rest, so memory never steers a routine that didn't ask for it.
memory: native
# The models an automation can run on, from the model catalog of Cursor's
# cloud agents (October 2026), with the efforts each one has. Cursor names
# the effort parameter differently for different models (effort, reasoning
# or reasoning_effort), some say extra-high for xhigh, and every model needs
# a whole variant (context, fast and so on); the API client translates.
# Cursor's Auto is what the routine's `default` entry gets.
models:
  claude-fable-5-1: [low, medium, high, xhigh, max]
  claude-fable-5: [low, medium, high, xhigh, max]
  claude-haiku-4-5: []
  claude-haiku-5-5: [low, medium, high, xhigh, max]
  claude-opus-4-5: []
  claude-opus-4-6: [low, medium, high, max]
  claude-opus-4-7: [low, medium, high, xhigh, max]
  claude-opus-4-8: [low, medium, high, xhigh, max]
  claude-opus-5-5: [low, medium, high, xhigh, max]
  claude-opus-5: [low, medium, high, xhigh, max]
  claude-sonnet-4-5: []
  claude-sonnet-4-6: [low, medium, high, max]
  claude-sonnet-4: []
  claude-sonnet-5-5: [low, medium, high, xhigh, max]
  claude-sonnet-5: [low, medium, high, xhigh, max]
  composer-2.5: []
  gemini-2.5-flash: []
  gemini-3-flash: []
  gemini-3.1-pro: []
  gemini-3.5-flash: []
  gemini-3.6-flash: [minimal, low, medium, high]
  gemini-3.7-flash: [low, medium, high]
  gemini-3.8-flash: [low, medium, high]
  gemini-4-argon: [low, medium, high]
  glm-5.2: [high, max]
  glm-5.3-flash: [low, high, max]
  glm-5.3: [low, high, max]
  gpt-5-mini: []
  gpt-5.1: [low, medium, high]
  gpt-5.2: [low, medium, high, xhigh]
  gpt-5.3-codex: [low, medium, high, xhigh]
  gpt-5.4-mini: [none, low, medium, high, xhigh]
  gpt-5.4-nano: [none, low, medium, high, xhigh]
  gpt-5.4: [none, low, medium, high, xhigh]
  gpt-5.5: [none, low, medium, high, xhigh]
  gpt-5.6-luna: [none, low, medium, high, xhigh, max]
  gpt-5.6-sol: [none, low, medium, high, xhigh, max]
  gpt-5.6-terra: [none, low, medium, high, xhigh, max]
  grok-4.5: [low, medium, high]
  grok-4.6: [low, medium, high, xhigh]
  grok-4.7: [low, medium, high, xhigh]
  kimi-k2.7-code: []
  kimi-k3: [low, high, max]
  muse-spark-1.3: [minimal, low, medium, high, xhigh, max]
# The models with a fast mode in Cursor's catalog. Some of them run fast by
# default (Grok, Composer, GPT-5.2 and GPT-5.3 Codex), so the stub always
# sets it: on for entries that say fast: true, off for the rest.
fast_models:
  - claude-opus-4-7
  - claude-opus-4-8
  - claude-opus-5
  - claude-opus-5-5
  - composer-2.5
  - gpt-5.2
  - gpt-5.3-codex
  - gpt-5.4
  - gpt-5.5
  - gpt-5.6-luna
  - gpt-5.6-sol
  - gpt-5.6-terra
  - grok-4.5
  - grok-4.6
  - grok-4.7
# What Cursor calls the models it doesn't call by their makers' names.
model_ids:
  glm-5.3: glm-5p3
  glm-5.3-flash: glm-5p3-flash
# The API key the API needs. `fabrica auth login` opens the page that
# makes one, checks the key with Cursor, and saves it in your keychain.
credentials:
  CURSOR_API_KEY:
    description: a Cursor API key
    url: https://cursor.com/dashboard/api
    instructions: Create a new API key, call it fabrica, and copy it.
    aliases: [CURSOR_TOKEN] # what Cursor's Terraform provider calls it
