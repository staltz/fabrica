# OpenAI Codex cloud.
#
# Our best reading of the Codex docs as of October 2026. Codex can review
# pull requests automatically and run scheduled tasks. There's no public API
# to create automations, so Fabrica uses handoff.
kind: cloud
description: OpenAI Codex cloud tasks
apply_modes: [handoff]
# An init routine's session is a one-off Codex cloud task, which launch.md
# says how to start.
launch_modes: [handoff]
find_by_identity: false
skill_transport: text
mcp_auth:
  header: unsupported
  url: native
triggers:
  schedule: native
  github.pull_request.opened: native
connectors:
  github: native
  mcp.http: native
  mcp.sse: unsupported
  mcp.stdio: unsupported
side_effects:
  "*": emulated
# Codex's memory (a preview) is per project, with no per-task setting, so a
# routine that needs memory gets it from Fabrica.
memory: emulated
# Each task has its own model and reasoning effort setting. These are the
# OpenAI models we know Codex offers as of October 2026; corrections welcome.
models:
  gpt-5.6-sol: [low, medium, high, xhigh]
  gpt-5.6-terra: [low, medium, high, xhigh]
  gpt-5.6-luna: [low, medium, high, xhigh]
  gpt-5.5: [low, medium, high, xhigh]
  gpt-5.3-codex: [low, medium, high, xhigh]
