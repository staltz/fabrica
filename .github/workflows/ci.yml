name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Examples still pass `fabrica check`
        run: |
          go build -o fabrica ./cmd/fabrica
          ./fabrica check examples/starter-factory
          ./fabrica check examples/custom-provider/factory
